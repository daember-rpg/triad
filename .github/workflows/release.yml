# Attaches a Foundry-installable zip and module.json to every published release.
#
# To release: bump "version" in module.json, then on GitHub go to Releases → Draft a new release,
# create the tag v<version> (e.g. v0.7.2-alpha) and click Publish. This workflow then builds
# triad.zip and attaches it with module.json, so the manifest URL
# https://github.com/daember-rpg/triad/releases/latest/download/module.json always points at the
# newest release. Leave "Set as a pre-release" unticked: "latest" skips pre-releases.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check the tag matches module.json
        run: |
          VERSION=$(jq -r .version module.json)
          TAG="${{ github.event.release.tag_name }}"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match module.json version $VERSION"
            exit 1
          fi

      - name: Point the download URL at this release
        run: |
          TAG="${{ github.event.release.tag_name }}"
          jq --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/triad.zip" \
            '.download = $url' module.json > module.tmp && mv module.tmp module.json

      - name: Build the zip
        run: zip -r triad.zip module.json LICENSE.txt README.md lang scripts styles templates

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" triad.zip module.json --clobber
